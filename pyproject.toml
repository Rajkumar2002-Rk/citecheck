[project]
name = "citecheck"
version = "0.1.0"
description = "Citation verification harness for LLM-extracted audit claims"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.6.0",
    "httpx>=0.28.1",
    "pydantic>=2.13.5",
    "pytest>=9.1.1",
    "rich>=15.0.0",
    "selectolax>=0.4.12",
    "typer>=0.27.2",
]

[project.scripts]
citecheck = "citecheck.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["citecheck"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
package = true
